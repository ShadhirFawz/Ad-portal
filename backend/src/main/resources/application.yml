spring:
  application:
    name: marketplace-backend

  profiles:
    active: dev

server:
  port: ${PORT:8080}

security:

  jwt:

    secret: ${JWT_SECRET}
    issuer: marketplace
    access-token-expiration: 15m
    refresh-token-expiration: 30d

  cors:

    allowed-origins:
      - http://localhost:3000
      - http://127.0.0.1:3000
      - http://192.168.8.121:3000

    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS

    allowed-headers:
      - "*"

    allow-credentials: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    try-it-out-enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    deep-linking: true
    default-models-expand-depth: 1
    default-model-expand-depth: 1
    show-extensions: true
    show-common-extensions: true
  show-actuator: false

logging:
  level:
    root: INFO